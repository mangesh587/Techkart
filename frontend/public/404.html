<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <script>
    const repo = "/Techkart";
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    const route = path.startsWith(repo)
      ? path.substring(repo.length)
      : path;

    sessionStorage.setItem(
      "redirect",
      route + search + hash
    );

    window.location.replace(repo + "/");
  </script>
</head>

<body>
</body>
</html>
